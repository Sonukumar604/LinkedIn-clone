server:
  port: 9000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret:
    key: iloveyoukhushiiloveyousomuchiloveyouiloveyouiloveyouyouaremyeverythinglpgo4k[plv'lmberokgmietbonryojneoimgrtbmm

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG



spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URI:lb://USER-SERVICE}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=2

        - id: posts-service
          uri: ${POSTS_SERVICE_URI:lb://POSTS-SERVICE}
          predicates:
            - Path=/api/v1/posts/**
          filters:
            - StripPrefix=2
            - AuthenticationFilter

        - id: connections-service
          uri: ${CONNECTIONS_SERVICE_URI:lb://CONNECTIONS-SERVICE}
          predicates:
            - Path=/api/v1/connections/**
          filters:
            - StripPrefix=2
            - AuthenticationFilter

        - id: notifications-service
          uri: ${NOTIFICATION_SERVICE_URI:lb://NOTIFICATIONS-SERVICE}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=2
            - AuthenticationFilter

        - id: uploader-service
          uri: lb://UPLOADER-SERVICE
          predicates:
              - Path=/api/v1/uploads/**
          filters:
              - StripPrefix=2
              - AuthenticationFilter