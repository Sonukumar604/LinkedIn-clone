
server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret:
    key: iloveyoukhushiiloveyousomuchiloveyouiloveyouiloveyouyouaremyeverythinglpgo4k[plv'lmberokgmietbonryojneoimgrtbmm


logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.filter: DEBUG
    org.springframework.cloud.gateway.handler: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    reactor.netty.http.client: DEBUG
    org.springframework.boot.context.config: TRACE

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,gateway

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=2

        - id: posts-service
          uri: lb://posts-service
          predicates:
            - Path=/api/v1/posts/**
          filters:
            - StripPrefix=2
            - AuthenticationFilter

        - id: connections-service
          uri: lb://connections-service
          predicates:
            - Path=/api/v1/connections/**
          filters:
            - StripPrefix=2
            - AuthenticationFilter