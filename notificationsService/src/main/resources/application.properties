spring.application.name=notifications-service

server.servlet.context-path=/notifications
server.port=9040

spring.datasource.url=jdbc:postgresql://${DB_SERVER:notification-db}:${DB_PORT:5432}/${DB_NAME:notificationDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
# Bump group ID to bypass saved committed offsets completely
spring.kafka.consumer.group-id=notifications-group-v4
spring.kafka.consumer.auto-offset-reset=latest

# Key Deserializer (Long) & Error-Handling Value Deserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Delegate to JsonDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Disable Type Headers to ignore source package names sent by Producer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*