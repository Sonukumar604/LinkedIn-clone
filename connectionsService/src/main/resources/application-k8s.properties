# Neo4j Database Configuration
spring.neo4j.uri=${SPRING_NEO4J_URI:bolt://127.0.0.1:7687}
spring.neo4j.authentication.username=${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
spring.neo4j.authentication.password=${SPRING_NEO4J_AUTHENTICATION_PASSWORD:LinkedIn@2026}

eureka.client.register-with-eureka= false
eureka.client.fetch-registry= false

spring.kafka.bootstrap-servers=kafka:9092