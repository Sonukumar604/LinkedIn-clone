apiVersion: apps/v1
kind: Deployment
metadata:
  name: connections-service
spec:
  selector:
    matchLabels:
      app: connections-service
  template:
    metadata:
      labels:
        app: connections-service
    spec:
      containers:
      - name: connections-service
        image: sonukumar21/linkedin-app-connections-service?uuid=8CA2F3D8-1848-4CF8-9DBA-657A8B74E080
        resources:
          limits:
            memory: "400Mi"
            cpu: "200m"
          requests:
            memory: "200Mi"
            cpu: "100m"
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: k8s
          - name: SPRING_NEO4J_AUTHENTICATION_USERNAME
            value: neo4j
          - name: SPRING_NEO4J_AUTHENTICATION_PASSWORD
            value: LinkedIn@2026
          - name: SPRING_NEO4J_URI
            value: bolt://connections-db:7687
          - name: KAFKA_LOG4J_ROOT_LOGLEVEL
            value: "ERROR"
        ports:
        - containerPort: 9030

---

apiVersion: v1
kind: Service
metadata:
  name: connections-service
spec:
  selector:
    app: connections-service
  ports:
  - port: 80
    targetPort: 9030
