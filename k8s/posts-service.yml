apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts-service
spec:
  selector:
    matchLabels:
      app: posts-service
  template:
    metadata:
      labels:
        app: posts-service
    spec:
      containers:
      - name: posts-service
        image: sonukumar21/linkedin-app-posts-service/general
        resources:
          limits:
            memory: "400Mi"
            cpu: "200m"
          requests:
            memory: "200Mi"
            cpu: "100m"
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: k8s
        - name: DB_URL
          value: jdbc:postgresql://posts-db:5432/postsDB
        - name: DB_USERNAME
          value: user
        - name: DB_PASSWORD
          value: password
        ports:
        - containerPort: 9010

---

apiVersion: v1
kind: Service
metadata:
  name: posts-service
spec:
  selector:
    app: posts-service
  ports:
  - port: 80
    targetPort: 9010
