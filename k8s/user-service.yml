apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: linkedin-app-user-service?uuid=8CA2F3D8-1848-4CF8-9DBA-657A8B74E080
        resources:
          limits:
            memory: "400Mi"
            cpu: "200m"
          requests:
            memory: "200Mi"
            cpu: "100m"
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: k8s
          - name: DB_USERNAME
            value: postgres
          - name: DB_PASSWORD
            value: khushi
          - name: DB_SERVER
            value: user-db
          - name: DB_NAME
            value: userDB
          - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
            value: kafka.kafka.svc.cluster.local:9092
        ports:
        - containerPort: 9020

---

apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
  ports:
  - port: 80
    targetPort: 9020
